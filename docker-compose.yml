version: '3.8'

services:
  adonis:
    build: .
    container_name: adonis_app
    restart: always
    env_file:
      - .env
    ports:
      - '3333:3333'
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/sites:/etc/nginx/conf.d
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - adonis
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
